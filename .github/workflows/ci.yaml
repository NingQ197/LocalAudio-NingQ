name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publish boundary and shell syntax
        run: |
          python3 tools/check_publish.py
          sh -n server/entrypoint.sh server/healthcheck.sh scripts/deploy.sh
      - name: Test configuration validation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate Compose definitions
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml config --quiet
      - name: Build audited relay
        run: docker build --no-cache -t localaudio-ningq:test ./server
      - name: Test real TURN authentication and network policy
        env:
          LOCAL_AUDIO_TEST_IMAGE: localaudio-ningq:test
        run: python3 -m unittest discover -s tests -p 'test_container.py' -v
